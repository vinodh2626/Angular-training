<h2>My Cart</h2>

@if (cartProduct.length > 0) {

  @for (product of cartProduct; track product.id) {

    <div class="cart-card">

      <img
        [src]="product.thumbnail"
        alt="product"
      >

      <h3>{{ product.title }}</h3>

      <p>{{ product.description }}</p>

      <p>Category: {{ product.category }}</p>

      <strong>₹ {{ product.price }}</strong>

    </div>

  }

} @else {

  <p>No products added to cart</p>

}
